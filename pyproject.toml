[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evotail"
version = "0.1.0"
description = "Evolutionary-support-aware protein language model experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

